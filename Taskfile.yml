version: "3"

vars:
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: v8.30.1

tasks:
  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o bin/comporta{{exeExt}} ./cmd/comporta

  run:
    desc: Run serve with comporta.yaml from the current directory
    cmds:
      - go run ./cmd/comporta serve {{.CLI_ARGS}}

  validate:
    desc: Validate every example without secrets
    cmds:
      - for file in examples/*.yaml examples/observability/comporta-*.yaml; do go run ./cmd/comporta config validate "$file" || exit 1; done

  fmt:
    desc: Format the code
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail when a file is not formatted
    cmds:
      - test -z "$(gofmt -l .)"

  lint:
    desc: Run static checks
    cmds:
      - go vet ./...

  panel-assets:
    desc: Regenerate the panel templates and stylesheet with the pinned templ and Tailwind standalone CLI (downloaded once into bin/ and checked by its checksum)
    cmds:
      - bash scripts/panel-assets.sh

  panel-check:
    desc: Fail when the committed panel templates or stylesheet differ from what the pinned tools generate
    cmds:
      - bash scripts/panel-assets.sh --check

  test:
    desc: Run the test suite
    cmds:
      - go test ./...

  test-privacy:
    desc: Run marked traffic through the gateway and examine everything it leaves behind
    cmds:
      - go test -count=1 ./internal/testkit ./tests/privacy

  test-race:
    desc: Run the test suite with the race detector, which needs a C toolchain
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  test-sdk:
    desc: Run the official SDKs against the gateway and the fake provider, in a virtual environment
    cmds:
      - python -m venv .venv
      - '{{if eq OS "windows"}}.venv/Scripts/python{{else}}.venv/bin/python{{end}} -m pip install --quiet --require-hashes -r tests/sdk/requirements.txt'
      - '{{if eq OS "windows"}}.venv/Scripts/python{{else}}.venv/bin/python{{end}} -m pytest tests/sdk/compatibility_test.py -q'

  test-container:
    desc: Build the image and verify compose, hardening, key persistence, privacy and the observability profile. Needs Docker and ports 8080, 8081, 3000, 9090 and 16686 free
    cmds:
      - go test -tags container -timeout 40m ./tests/integration -run 'Compose|Container|Observability'

  test-alerts:
    desc: Run the unit tests of the example alerting rules with promtool, in the pinned Prometheus image
    cmds:
      - docker run --rm --entrypoint promtool -w /rules -v "{{.ROOT_DIR}}/examples/observability:/rules:ro" prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06 test rules alerts_test.yml

  test-distributed:
    desc: Run the shared stores, the coordinator, recovery and two serve processes against real Postgres and Redis containers. Needs Docker
    cmds:
      - go test -tags distributed -count=1 -timeout 40m ./internal/storage/... ./internal/distributed ./tests/distributed

  chart:
    desc: Lint and render the Helm chart, validate the rendered configuration and check that invalid values are refused. Needs helm
    cmds:
      - bash scripts/check-chart.sh

  test-kubernetes:
    desc: Install the chart on a throwaway kind cluster with two replicas. Needs Docker, kind, kubectl and helm
    cmds:
      - go test -tags kubernetes -count=1 -timeout 40m ./tests/kubernetes

  vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  secrets:
    desc: Scan the Git history for secrets
    cmds:
      - go run github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}} git --redact .

  check:
    desc: Run every local verification
    cmds:
      - task: fmt-check
      - task: panel-check
      - task: lint
      - task: test
      - task: test-privacy
      - task: validate
      - task: vuln
      - task: secrets
