version: "3"

vars:
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: v8.30.1

tasks:
  build:
    desc: Build the binary into bin/
    cmds:
      - go build -o bin/comporta{{exeExt}} ./cmd/comporta

  run:
    desc: Run serve with comporta.yaml from the current directory
    cmds:
      - go run ./cmd/comporta serve {{.CLI_ARGS}}

  validate:
    desc: Validate every example without secrets
    cmds:
      - for file in examples/*.yaml; do go run ./cmd/comporta config validate "$file" || exit 1; done

  fmt:
    desc: Format the code
    cmds:
      - gofmt -w .

  fmt-check:
    desc: Fail when a file is not formatted
    cmds:
      - test -z "$(gofmt -l .)"

  lint:
    desc: Run static checks
    cmds:
      - go vet ./...

  test:
    desc: Run the test suite
    cmds:
      - go test ./...

  test-privacy:
    desc: Run marked traffic through the gateway and examine everything it leaves behind
    cmds:
      - go test -count=1 ./internal/testkit ./tests/privacy

  test-race:
    desc: Run the test suite with the race detector, which needs a C toolchain
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race ./...

  test-sdk:
    desc: Run the official SDKs against the gateway and the fake provider, in a virtual environment
    cmds:
      - python -m venv .venv
      - '{{if eq OS "windows"}}.venv/Scripts/python{{else}}.venv/bin/python{{end}} -m pip install --quiet --require-hashes -r tests/sdk/requirements.txt'
      - '{{if eq OS "windows"}}.venv/Scripts/python{{else}}.venv/bin/python{{end}} -m pytest tests/sdk/compatibility_test.py -q'

  test-container:
    desc: Build the image and verify compose, hardening, key persistence and privacy. Needs Docker and ports 8080 and 8081 free
    cmds:
      - go test -tags container -timeout 15m ./tests/integration -run 'Compose|Container'

  vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  secrets:
    desc: Scan the Git history for secrets
    cmds:
      - go run github.com/zricethezav/gitleaks/v8@{{.GITLEAKS_VERSION}} git --redact .

  check:
    desc: Run every local verification
    cmds:
      - task: fmt-check
      - task: lint
      - task: test
      - task: test-privacy
      - task: validate
      - task: vuln
      - task: secrets
