# yaml-language-server: $schema=../../schema/comporta.schema.json
#
# The observability configuration pointed at the built-in fake provider of
# compose.fake-provider.yaml, to try the dashboard and the traces without any
# paid call. The fake answers every model name; prices below are made up.

data_dir: /data
timezone: UTC

providers:
  anthropic:
    api_format: anthropic
    base_url: http://172.31.250.10:9090
    models:
      - fake-claude
      - fake-haiku
  openai:
    api_format: openai
    base_url: http://172.31.250.10:9090/v1
    models:
      - fake-gpt

pricing:
  fake-claude: {input: 3, output: 15, cache_write: 3.75, cache_read: 0.3}
  fake-haiku: {input: 1, output: 5, cache_write: 1.25, cache_read: 0.1}
  fake-gpt: {input: 2, output: 8, cache_write: 2.5, cache_read: 0.2}

apps:
  my-app:
    allowed_models: [fake-claude, fake-haiku, fake-gpt]
    budget:
      usd_per_day: 5.00
    per_user:
      budget:
        usd_per_day: 0.50
    cache:
      enabled: true

listeners:
  proxy:
    bind: 0.0.0.0
    port: 8080
  admin:
    bind: 0.0.0.0
    port: 8081
  allowed_hosts:
    - comporta

telemetry:
  metrics_enabled: true
  otel_enabled: true
  otel_endpoint: http://jaeger:4318
