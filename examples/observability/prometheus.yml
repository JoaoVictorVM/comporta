# Prometheus for the observability profile of compose.yaml. It scrapes the
# admin listener of the gateway every 15 seconds with the admin token, read
# from a file mounted read-only: the token is never written here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: comporta
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/comporta_metrics_token
    static_configs:
      - targets: ["comporta:8081"]
