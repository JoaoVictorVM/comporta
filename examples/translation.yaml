# yaml-language-server: $schema=../schema/comporta.schema.json
#
# A fallback chain that mixes API formats, against the fake provider, with no
# real credentials. Start the fake provider with fake-claude overloaded:
#
#   comporta fake-provider --model-scenario fake-claude=overload
#
# then the gateway with `comporta serve --config examples/translation.yaml`,
# create a key with `comporta keys create chat` and send an Anthropic request
# for fake-claude. The answer is an Anthropic message generated by fake-gpt,
# with x-comporta-fallback: fake-claude->fake-gpt (529) and
# x-comporta-translated: openai->anthropic. A Responses API call such as
# POST /v1/responses with {"model":"fake-claude","input":"hi"} works the same
# way. Prices are illustrative overrides.

timezone: UTC
data_dir: ./data-translation

providers:
  fake-anthropic:
    api_format: anthropic
    base_url: http://127.0.0.1:9090
    anthropic_version: "2026-10-21"
    models: [fake-claude]
  fake-openai:
    api_format: openai
    base_url: http://127.0.0.1:9090
    models: [fake-gpt]

pricing:
  fake-claude: {input: 3.00, output: 15.00, cache_write: 3.75, cache_read: 0.30}
  fake-gpt: {input: 2.00, output: 8.00, cache_write: 2.00, cache_read: 0.50}

apps:
  chat:
    allowed_models: [fake-claude, fake-gpt]
    fallback: [fake-claude, fake-gpt]
    budget: {usd_per_day: 1.00}
