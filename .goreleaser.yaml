version: 2

builds:
  - id: comporta
    main: ./cmd/comporta
    binary: comporta
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - id: comporta
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - examples/*
      - schema/comporta.schema.json

checksum:
  name_template: checksums.txt
