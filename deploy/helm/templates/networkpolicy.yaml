{{- if .Values.networkPolicy.enabled }}
# Default deny in both directions, then only what the gateway needs. Kubelet
# probes are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "comporta.name" . }}
  labels: {{- include "comporta.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "comporta.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.proxyFrom }}
    - from: {{- toYaml .Values.networkPolicy.proxyFrom | nindent 8 }}
      ports: [{port: {{ .Values.service.proxyPort }}, protocol: TCP}]
    {{- end }}
    {{- if .Values.networkPolicy.adminFrom }}
    - from: {{- toYaml .Values.networkPolicy.adminFrom | nindent 8 }}
      ports: [{port: {{ .Values.service.adminPort }}, protocol: TCP}]
    {{- end }}
  egress:
    - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.networkPolicy.egress }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
