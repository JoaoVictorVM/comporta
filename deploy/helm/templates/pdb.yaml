apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "comporta.name" . }}
  labels: {{- include "comporta.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels: {{- include "comporta.selector" . | nindent 6 }}
